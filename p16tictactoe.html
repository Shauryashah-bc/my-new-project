<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic Tac Toe</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #f5f5f5;
            font-family: Arial, sans-serif;
        }

        .board {
            display: grid;
            grid-template-columns: repeat(3, 100px);
            grid-gap: 5px;
        }

        button {
            width: 100px;
            height: 100px;
            font-size: 2rem;
            border: 2px solid #333;
            background-color: white;
            cursor: pointer;
            transition: background-color 0.3s;
        }

        button:hover {
            background-color: #e0e0e0;
        }

        button:disabled {
            background-color: white; /* Keep original background */
            cursor: not-allowed;     /* Show disabled cursor */
            opacity: 1;              /* Prevent fading effect */
            color: black;            /* Ensure text color remains visible */
        }
    </style>
</head>
<body>
    <div class="board">
        <button id="b1"></button>
        <button id="b2"></button>
        <button id="b3"></button>
        <button id="b4"></button>
        <button id="b5"></button>
        <button id="b6"></button>
        <button id="b7"></button>
        <button id="b8"></button>
        <button id="b9"></button>
        <span id="win"></span>
    </div>
</body>
<script>
    let counter = 1
    b1 = document.querySelector("#b1")
    b2 = document.querySelector("#b2")
    b3 = document.querySelector("#b3")
    b4 = document.querySelector("#b4")
    b5 = document.querySelector("#b5")
    b6 = document.querySelector("#b6")
    b7 = document.querySelector("#b7")
    b8 = document.querySelector("#b8")
    b9 = document.querySelector("#b9")
    win = document.querySelector("#win")


    function checkforwin(){
        
    if (
        (b1.innerHTML === b2.innerHTML && b1.innerHTML === b3.innerHTML && b1.innerHTML !== "") ||
        (b4.innerHTML === b5.innerHTML && b4.innerHTML === b6.innerHTML && b4.innerHTML !== "") ||
        (b7.innerHTML === b8.innerHTML && b7.innerHTML === b9.innerHTML && b7.innerHTML !== "") ||
        (b1.innerHTML === b4.innerHTML && b1.innerHTML === b7.innerHTML && b1.innerHTML !== "") ||
        (b2.innerHTML === b5.innerHTML && b2.innerHTML === b8.innerHTML && b2.innerHTML !== "") ||
        (b3.innerHTML === b6.innerHTML && b3.innerHTML === b9.innerHTML && b3.innerHTML !== "") ||
        (b1.innerHTML === b5.innerHTML && b1.innerHTML === b9.innerHTML && b1.innerHTML !== "") ||
        (b3.innerHTML === b5.innerHTML && b3.innerHTML === b7.innerHTML && b3.innerHTML !== "")
    ) {
        win.innerHTML = "We have a winner!"
        return;
        
    }
    if (counter === 9){
        win.innerHTML = ("Tie.")
        return;
    }
 
    }



    
    b1.addEventListener("click", () => {
    
        if (counter % 2 === 1){
            b1.innerHTML = "O"

        }
        else{
            b1.innerHTML = "X"
        }
        b1.disabled = true
        checkforwin()
        counter ++
    })
