<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        form {
            background-color: #fff;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            display: flex;  
            flex-direction: column;
            gap: 15px;
            width: 300px;
        }

        input[type="text"] {
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 16px;
        }

        input[type="button"] {
            padding: 10px;
            background-color: #007bff;
            color: #fff;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
        }

        input[type="button"]:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>
    <form>
        <input type="text" id="minrange">
        <input type="text" id="maxrange">
        <input type="button" id="btnans" value="Click me"/>
        <span id="allprimenumbers"></span>
    </form>
</body>
<script>
    let n1 = document.querySelector("#minrange");
    let n2 = document.querySelector("#maxrange");
    let result = document.querySelector("#allprimenumbers");
    let btn = document.querySelector("#btnans");

    btn.addEventListener("click", () => {
        let min = parseInt(n1.value);
        let max = parseInt(n2.value);
        let primes = [];

        for (let i = min; i <= max; i++) {
            let p = 1;

            if (i < 2) {
                p = 0;
            } else {
                for (let j = 2; j <= Math.sqrt(i); j++) {
                    if (i % j === 0) {
                        p = 0;
                        break;
                    }
                }
            }

            if (p === 1) {
                primes.push(i);
            }
        }

        result.innerHTML = primes.join(", ");
    });
</script>

</html>
