<script>
    const d = new Date()
    let h = d.getHours
    if (h <= 17){
        if (h <= 12){
            if (h <= 4){
                alert("Its midnight")
            }
            else{
                alert("Its morning")
            }

        }
        else{
            alert("Its evening")
        }
    }
    else{
        alert("Its night")

    }
    
</script>
